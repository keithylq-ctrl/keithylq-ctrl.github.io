<p>现在我更愿意把它当作一个需要长期观察的问题。练习之后，哪些变化真实发生了？哪些只是期待？我会把感受、训练方法与能够核对的知识分开记录。</p>
<p>也许答案不会立刻出现，但稳定地练习和诚实地观察，本身就是一条路径。</p></article></main><footer class="site-footer"><span>© keithylq</span><a href="https://github.com/keithylq-ctrl">GitHub ↗</a></footer></div></body></html>
