<p>对我而言，精神自由还包括一种更实际的能力：不因缺钱而被迫违背自己的价值观，能够更自主地安排时间、分配注意力，保有自己的尊严。</p>
<p>我还没有发现那个既热爱又能稳定带来收入的方向。这个网站也许可以成为寻找过程的一部分：把兴趣变成持续的研究、练习和产出，看看它们会指向哪里。</p></article></main><footer class="site-footer"><span>© keithylq</span><a href="https://github.com/keithylq-ctrl">GitHub ↗</a></footer></div></body></html>
